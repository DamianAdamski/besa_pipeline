name: Daily BESA Pipeline

on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC daily (GitHub may delay this slightly under load)
  workflow_dispatch: {}    # lets you trigger a run manually from the Actions tab, for testing

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install rclone
        run: curl -fsSL https://rclone.org/install.sh | sudo bash

      - name: Configure rclone from secret
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          mkdir -p ~/.config/rclone
          printf '%s' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf

      - name: Prepare local data folders
        run: mkdir -p data/raw data/clean logs

      - name: Download previous state from OneDrive
        run: |
          rclone copy onedrive:BesaPipeline/data/raw/ data/raw/ --ignore-errors
          rclone copy onedrive:BesaPipeline/data/clean/ data/clean/ --ignore-errors

      - name: Run pipeline
        env:
          CLICKUP_TOKEN: ${{ secrets.CLICKUP_TOKEN }}
        run: python main.py

      - name: Upload results back to OneDrive
        run: |
          rclone copy data/raw/ onedrive:BesaPipeline/data/raw/
          rclone copy data/clean/ onedrive:BesaPipeline/data/clean/
